<!--
  Chirp app logo: full lockup on brand navy (#0F2A44).
  Source of truth for raster app-icon / splash exports.
  viewBox: 0 0 1024 1024. Mark is chirp-mark.svg at 1.8x, centered.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Chirp logo">
  <rect width="1024" height="1024" fill="#0F2A44" />
  <g transform="translate(51.2 51.2) scale(1.8)">
    <defs>
      <mask id="chirp-seal" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
        <rect width="512" height="512" fill="#000000" />
        <circle cx="256" cy="256" r="196" fill="#FFFFFF" />
        <path
          d="M 130 268 H 178 L 212 168 L 248 352 L 284 224 L 314 268 H 382"
          fill="none"
          stroke="#000000"
          stroke-width="46"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </mask>
    </defs>
    <rect width="512" height="512" fill="#FFC247" mask="url(#chirp-seal)" />
  </g>
</svg>
