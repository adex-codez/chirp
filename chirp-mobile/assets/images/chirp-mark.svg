<!--
  Chirp mark: a gold seal with the call cut through it. The trace is a
  true hole, so the mark works on any plate.
  Original artwork drawn for the Chirp app.
  viewBox: 0 0 512 512
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Chirp mark">
  <defs>
    <mask id="chirp-seal" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#000000" />
      <circle cx="256" cy="256" r="196" fill="#FFFFFF" />
      <path
        d="M 130 268 H 178 L 212 168 L 248 352 L 284 224 L 314 268 H 382"
        fill="none"
        stroke="#000000"
        stroke-width="46"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </mask>
  </defs>
  <rect width="512" height="512" fill="#FFC247" mask="url(#chirp-seal)" />
</svg>
